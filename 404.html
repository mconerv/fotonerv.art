<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — кадр не найден · FotoNerv</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<style>
  html{font-synthesis-weight:none}  /* у Oranienbaum одно начертание — без фальшивого полужирного */
  @font-face { font-family:'Oranienbaum'; font-style:normal; font-display:swap; font-weight:400; src:url(/assets/fonts/oranienbaum-regular.woff2) format('woff2'); }
  @font-face { font-family:'Arsenal'; font-style:normal; font-display:swap; font-weight:400; size-adjust:104%; src:url(/assets/fonts/arsenal-regular.woff2) format('woff2'); }
  @font-face { font-family:'Arsenal'; font-style:normal; font-display:swap; font-weight:700; size-adjust:104%; src:url(/assets/fonts/arsenal-bold.woff2) format('woff2'); }

  :root{--graphite:#1D140E;--fog:#EAE4D6;--ash:#B9A48F;--impulse:#FF8F1F}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--graphite);color:var(--fog);font-family:'Arsenal',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px}
  .code{font-family:'Oranienbaum',serif;font-weight:400;font-size:clamp(4rem,14vw,8rem);line-height:1;color:var(--impulse)}
  h1{font-family:'Oranienbaum',serif;font-weight:400;font-size:clamp(1.1rem,3vw,1.6rem);margin:14px 0 10px}
  p{color:var(--ash);margin-bottom:28px}
  a.btn{display:inline-block;font-family:'Arsenal',sans-serif;font-weight:700;font-size:.92rem;color:var(--fog);text-decoration:none;border:1px solid var(--impulse);border-radius:99px;padding:13px 26px;transition:.25s}
  a.btn:hover{background:var(--impulse)}
</style>
</head>
<body>
<div>
  <div class="code">404</div>
  <h1>Кадр не найден</h1>
  <p>Такой страницы нет — возможно, она осталась за кадром.</p>
  <a class="btn" href="/">На главную</a>
</div>
</body>
</html>
