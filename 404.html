<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — кадр не найден · FotoNerv</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600&family=Manrope:wght@400;500&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
<style>
  :root{--graphite:#15171C;--fog:#EAE4D6;--ash:#8F94A0;--impulse:#E23D30}
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--graphite);color:var(--fog);font-family:'Manrope',sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:22px}
  .code{font-family:'Unbounded',sans-serif;font-weight:600;font-size:clamp(4rem,14vw,8rem);line-height:1;color:var(--impulse)}
  h1{font-family:'Unbounded',sans-serif;font-weight:500;font-size:clamp(1.1rem,3vw,1.6rem);margin:14px 0 10px}
  p{color:var(--ash);margin-bottom:28px}
  a.btn{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:.8rem;letter-spacing:.12em;text-transform:uppercase;color:var(--fog);text-decoration:none;border:1px solid var(--impulse);border-radius:99px;padding:13px 26px;transition:.25s}
  a.btn:hover{background:var(--impulse)}
</style>
</head>
<body>
<div>
  <div class="code">404</div>
  <h1>Кадр не найден</h1>
  <p>Такой страницы нет — возможно, она осталась за кадром.</p>
  <a class="btn" href="/">На главную</a>
</div>
</body>
</html>
